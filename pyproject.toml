[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-motionlens"
version = "1.0.0"
description = "NASA Space Apps 2026 - Dancing with the SARs: Multi-band NISAR (L/S-Band) InSAR & PolSAR Surface Deformation Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alireza Sani", email = "alirezafazeli@live.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "plotly>=5.20.0",
    "pydeck>=0.9.0",
    "streamlit>=1.50.0",
    "pytest>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/fazeli1977-dot/SAR-MotionLens"
Repository = "https://github.com/fazeli1977-dot/SAR-MotionLens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
